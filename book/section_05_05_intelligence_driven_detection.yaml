# section_05_05_intelligence_driven_detection.yaml

---
title: Intelligence Driven Detection
updated: '2026-06-12'
version: '1.0'
authors:
  - Raghav Dinesh
inline_markup: none
section_info:
  chapter: 5
  section: 5
  section_code: '0505'
  source_chapter: '4.4'
  source_key: threat_intelligence_operations.intelligence_driven_detection
  license: MIT
  repository: https://github.com/ruwgxo/security-operating-manual
prose_content:
  - heading: Overview
    id: overview
    blocks:
      - type: prose
        text: >-
          Threat intelligence enables proactive detection by informing what to detect, how to detect,
          and when to detect. This section addresses integrating intelligence into detection engineering,
          automated IOC operationalization, and intelligence-driven threat hunting.
  - heading: Intelligence to Detection Workflow
    id: intelligence_to_detection_workflow
    blocks:
      - type: heading
        level: 3
        text: Tactical Intelligence to Detection
      - type: heading
        level: 4
        text: IOC Based Detection
      - type: heading
        level: 5
        text: Automated IOC Detection
      - type: fields
        subject: Process
        entries:
          - label: Step 1
            value: TIP receives high-confidence IOC
          - label: Step 2
            value: TIP validates IOC (not whitelisted, still active)
          - label: Step 3
            value: TIP pushes to security tools (SIEM, EDR, firewall)
          - label: Step 4
            value: Tools alert/block on IOC match
      - type: definition
        items:
          - term: Timing
            description: Real-time (minutes from IOC receipt to detection)
      - type: heading
        level: 5
        text: IOC Detection Rules
      - type: heading
        level: 6
        text: SIEM Correlation
      - type: definition
        items:
          - term: Example
            description: Alert when any internal host contacts known C2 IP
      - type: code
        lang: text
        caption: >-
          Rule logic
        text: |
          sourcetype=firewall action=allowed
          | lookup threat_intel_ips ip AS dest_ip OUTPUT threat_level, adversary
          | where threat_level="high"
          | alert
      - type: fields
        subject: EDR Detection
        entries:
          - label: Example
            value: Alert when known-malicious hash executes
          - label: Implementation
            value: EDR IOC watchlist with automatic alerting
      - type: heading
        level: 6
        text: DNS Detection
      - type: definition
        items:
          - term: Example
            description: Alert on DNS query to known-malicious domain
      - type: code
        lang: text
        caption: >-
          Rule logic
        text: |
          sourcetype=dns
          | lookup threat_intel_domains domain OUTPUT threat_level
          | where threat_level="high"
          | alert
      - type: heading
        level: 5
        text: IOC Detection Challenges
      - type: fields
        subject: Short IOC Lifespan
        entries:
          - label: Problem
            value: Adversaries rotate infrastructure (IPs, domains) frequently
          - label: Solution
            value:
              - Focus on recent IOCs (<30 days old)
              - Combine IOC detection with behavioral detection
              - Use IOCs for threat hunting, not just alerting
      - type: fields
        subject: False Positives
        entries:
          - label: Problem
            value: Legitimate services flagged as malicious (CDNs, cloud providers)
          - label: Solution
            value:
              - Whitelist known-good infrastructure
              - Require high confidence before auto-blocking
              - Human review for medium-confidence IOCs
      - type: fields
        subject: Adversary Evasion
        entries:
          - label: Problem
            value: Adversaries avoid known-bad infrastructure
          - label: Solution
            value:
              - Don't rely solely on IOC detection
              - Implement behavioral detection (see operational intelligence)
              - Use IOCs for attribution and hunting, not just blocking
      - type: heading
        level: 3
        text: Operational Intelligence to Detection
      - type: heading
        level: 4
        text: TTP Based Detection
      - type: definition
        items:
          - term: Concept
            description: Detect adversary tactics and techniques (TTPs), not just IOCs
      - type: heading
        level: 5
        text: Advantages
      - type: list
        style: bullet
        items:
          - TTPs change slower than IOCs (adversary tooling, tradecraft)
          - Harder for adversaries to evade
          - Detects novel campaigns using known techniques
      - type: heading
        level: 5
        text: MITRE ATT&CK Informed Detection
      - type: fields
        subject: Process
        entries:
          - label: Step 1
            value: Intelligence identifies adversary TTPs
          - label: Step 2
            value: Map TTPs to MITRE ATT&CK techniques
          - label: Step 3
            value: Assess detection coverage for techniques
          - label: Step 4
            value: Build detection rules for uncovered techniques
          - label: Step 5
            value: Prioritize based on adversary prevalence and impact
      - type: heading
        level: 6
        text: Example
      - type: definition
        items:
          - term: Intelligence
            description: APT29 uses Kerberoasting for privilege escalation
          - term: MITRE technique
            description: 'T1558.003 - Steal or Forge Kerberos Tickets: Kerberoasting'
          - term: Detection gap
            description: No current detection for Kerberoasting
      - type: fields
        subject: Detection rule
        entries:
          - label: Detection rule
            value:
              - 'Name: Kerberoasting - RC4 Encryption Downgrade'
              - 'Data source: Windows Security Event Log (4769)'
              - 'Tuning: Whitelist known service accounts using RC4'
              - 'Tuning: Baseline normal RC4 usage'
              - 'Tuning: Alert on anomalous volume'
      - type: code
        lang: text
        caption: >-
          Detection rule / Logic
        text: |
          Event ID 4769 (Kerberos Service Ticket Request)
          Ticket Encryption Type = 0x17 (RC4)
          Service Name NOT ending in $ (not machine account)
          Account Name NOT in whitelist (legitimate service accounts)
          → Alert: Possible Kerberoasting
      - type: heading
        level: 5
        text: Detection Engineering from Campaign Reports
      - type: heading
        level: 6
        text: Workflow
      - type: fields
        subject: 'Step 1: Report analysis'
        entries:
          - label: 'Step 1: Report analysis'
            value:
              - Read operational intelligence report on campaign
              - Extract adversary kill chain and TTPs
              - Identify detection opportunities at each stage
      - type: fields
        subject: 'Step 2: Detection opportunity mapping'
        entries:
          - label: 'Step 2: Detection opportunity mapping'
            value:
              - 'Example campaign: Emotet malware distribution'
              - 'Kill chain / Initial access / TTP: Phishing email with malicious macro (T1566.001)'
              - 'Kill chain / Initial access / Detection opportunities: Email gateway: Block macro-enabled
                attachments'
              - 'Kill chain / Initial access / Detection opportunities: EDR: Alert on Office spawning
                PowerShell'
              - 'Kill chain / Initial access / Detection opportunities: SIEM: Alert on suspicious macro
                execution'
              - 'Kill chain / Execution / TTP: PowerShell download cradle (T1059.001)'
              - 'Kill chain / Execution / Detection opportunities: EDR: Alert on PowerShell downloading
                executables'
              - 'Kill chain / Execution / Detection opportunities: Proxy: Alert on PowerShell user-agent
                in web requests'
              - 'Kill chain / Execution / Detection opportunities: SIEM: Alert on encoded PowerShell commands'
              - 'Kill chain / Persistence / TTP: Scheduled task creation (T1053.005)'
              - 'Kill chain / Persistence / Detection opportunities: EDR: Alert on scheduled task creation'
              - 'Kill chain / Persistence / Detection opportunities: SIEM: Windows Event 4698 (Scheduled
                Task Created)'
              - 'Kill chain / Lateral movement / TTP: SMB/PSExec (T1021.002)'
              - 'Kill chain / Lateral movement / Detection opportunities: SIEM: Alert on PSExec service
                creation'
              - 'Kill chain / Lateral movement / Detection opportunities: Network: Alert on SMB admin
                share access from non-admin hosts'
      - type: fields
        subject: 'Step 3: Detection development'
        entries:
          - label: 'Step 3: Detection development'
            value:
              - Write Sigma rules for each detection opportunity
              - Test rules against historical data
              - Deploy to SIEM/EDR
              - Monitor false positive rate
      - type: fields
        subject: 'Step 4: Coverage validation'
        entries:
          - label: 'Step 4: Coverage validation'
            value:
              - Map deployed detections to MITRE ATT&CK Navigator
              - Identify remaining gaps
              - Prioritize next detection development
      - type: heading
        level: 5
        text: Behavior Based Detection
      - type: definition
        items:
          - term: Concept
            description: Detect patterns of behavior indicating compromise, not specific IOCs
      - type: heading
        level: 6
        text: Examples
      - type: fields
        subject: Anomalous Authentication
        entries:
          - label: Intelligence
            value: Adversaries use compromised credentials for lateral movement
          - label: Behavior pattern
            value:
              - User authenticates from unusual location
              - User authenticates at unusual time
              - User authenticates to unusual systems
              - Multiple failed authentications followed by success
          - label: Detection approach
            value:
              - Baseline normal authentication patterns per user
              - Alert on statistical outliers
              - Machine learning for complex patterns
      - type: fields
        subject: Data Exfiltration
        entries:
          - label: Intelligence
            value: Adversaries stage and exfiltrate data over days/weeks
          - label: Behavior pattern
            value:
              - Unusual large file transfers
              - Access to large volume of sensitive files
              - Compression/archiving of data
              - Transfer to external/unusual destination
          - label: Detection approach
            value:
              - Monitor data access volume per user
              - Alert on bulk file access or transfer
              - Correlate file access + compression + transfer
      - type: fields
        subject: Living Off the Land
        entries:
          - label: Intelligence
            value: Adversaries use built-in OS tools to avoid malware detection
          - label: Behavior pattern
            value:
              - Unusual use of PowerShell, WMI, PsExec
              - Legitimate tools used in malicious ways
              - Process execution chains (cmd → powershell → certutil)
          - label: Detection approach
            value:
              - Process relationship analysis
              - Command-line argument analysis
              - Baseline normal admin tool usage
  - heading: Intelligence Driven Threat Hunting
    id: intelligence_driven_threat_hunting
    blocks:
      - type: heading
        level: 3
        text: Overview
      - type: prose
        text: >-
          Threat hunting uses intelligence to proactively search for threats that evaded detection. Intelligence
          provides hypotheses to test and IOCs to hunt for.
      - type: heading
        level: 3
        text: Hunting Workflow
      - type: heading
        level: 4
        text: Hypothesis Driven Hunting
      - type: heading
        level: 5
        text: 'Step 1: Intelligence Review'
      - type: list
        style: bullet
        items:
          - Review recent intelligence reports
          - Identify campaigns targeting your industry
          - Note adversary TTPs and IOCs
      - type: fields
        subject: 'Step 2: Hypothesis Generation'
        entries:
          - label: Intelligence input
            value: APT29 targeting financial services with spear phishing
          - label: Hypothesis
            value: APT29 may have compromised users in our organization via phishing
      - type: fields
        subject: 'Step 3: Hunt Plan'
        entries:
          - label: Questions to answer
            value:
              - Did any users receive emails matching APT29 phishing themes?
              - Did any users click links or open attachments?
              - Are there indicators of post-exploitation activity?
          - label: Data sources
            value:
              - Email gateway logs (sender, subject, attachments)
              - Proxy logs (link clicks)
              - EDR telemetry (post-exploitation behaviors)
          - label: Timeframe
            value: Past 90 days
      - type: heading
        level: 5
        text: 'Step 4: Hunt Execution'
      - type: heading
        level: 6
        text: Email Analysis
      - type: code
        lang: text
        caption: >-
          Query
        text: |
          sourcetype=email
          | search sender_domain IN (threat_intel_phishing_domains)
          OR subject IN (*invoice*, *payment*, *urgent*)
          | stats count by recipient, sender, subject
      - type: definition
        items:
          - term: Findings
            description: 15 users received suspicious emails, 3 clicked links
      - type: heading
        level: 6
        text: Post-Exploitation Hunting
      - type: code
        lang: text
        caption: >-
          Query
        text: |
          sourcetype=edr
          | search user IN (phishing_victims)
          | search (process_name=powershell.exe OR process_name=cmd.exe)
          | where NOT normal_admin_activity
          | stats count by user, process_name, command_line
      - type: definition
        items:
          - term: Findings
            description: '1 user: PowerShell download cradle executed 2 days after phishing'
      - type: heading
        level: 5
        text: 'Step 5: Investigation'
      - type: list
        style: bullet
        items:
          - Escalate finding to incident response
          - Full forensic investigation of compromised system
          - Extract IOCs and TTPs from investigation
          - Feed back to threat intelligence
      - type: heading
        level: 4
        text: IOC Driven Hunting
      - type: heading
        level: 5
        text: 'Step 1: IOC Acquisition'
      - type: list
        style: bullet
        items:
          - TIP receives new high-value IOCs from intelligence
          - Filter IOCs by relevance and confidence
      - type: heading
        level: 5
        text: 'Step 2: Historical Search'
      - type: definition
        items:
          - term: Approach
            description: Search historical logs for IOC matches
      - type: code
        lang: text
        caption: >-
          Query example
        text: |
          index=proxy earliest=-90d
          | search url IN (threat_intel_c2_domains)
          | stats count by src_ip, url, timestamp
      - type: definition
        items:
          - term: Purpose
            description: Identify if adversary was present but undetected
      - type: fields
        subject: 'Step 3: Endpoint Sweep'
        entries:
          - label: Approach
            value: Scan all endpoints for file hash IOCs
          - label: Tools
            value: EDR remote query, custom scripts
          - label: Purpose
            value: Identify dormant malware on endpoints
      - type: fields
        subject: 'Step 4: Memory Analysis'
        entries:
          - label: Approach
            value: Capture and analyze memory for in-memory threats
          - label: Tools
            value: Volatility, Rekall, commercial memory forensics
          - label: Purpose
            value: Detect fileless malware, injected code
      - type: heading
        level: 4
        text: TTP Driven Hunting
      - type: definition
        items:
          - term: Concept
            description: Hunt for specific adversary techniques even without IOCs
      - type: heading
        level: 5
        text: Example 1 Credential Dumping
      - type: definition
        items:
          - term: Intelligence
            description: Adversary uses Mimikatz for credential theft
          - term: Technique
            description: T1003.001 - LSASS Memory
      - type: heading
        level: 6
        text: Hunt Approach
      - type: list
        style: bullet
        items:
          - Search for LSASS process access (Sysmon Event 10)
          - Search for suspicious process command lines (mimikatz, sekurlsa)
          - Search for credential dumping tool file hashes
      - type: code
        lang: text
        caption: >-
          Query
        text: |
          sourcetype=sysmon EventCode=10
          TargetImage=*lsass.exe
          | where NOT (SourceImage IN legitimate_tools)
          | stats count by SourceImage, Computer
      - type: heading
        level: 5
        text: Example 2 Persistence Mechanisms
      - type: definition
        items:
          - term: Intelligence
            description: Adversary establishes persistence via registry run keys
          - term: Technique
            description: T1547.001 - Registry Run Keys / Startup Folder
      - type: heading
        level: 6
        text: Hunt Approach
      - type: list
        style: bullet
        items:
          - Search registry modification events (Sysmon Event 13)
          - Focus on common persistence locations (Run, RunOnce)
          - Identify unusual or unsigned executables
      - type: code
        lang: text
        caption: >-
          Query
        text: |
          sourcetype=sysmon EventCode=13
          TargetObject=*CurrentVersion\\Run*
          | where NOT (Image IN known_legitimate_installers)
          | stats count by TargetObject, Details, Computer
      - type: heading
        level: 3
        text: Hunting Maturity Model
      - type: fields
        subject: 'Level 0: No Hunting'
        entries:
          - label: Characteristics
            value: Reactive only, no proactive threat hunting
      - type: fields
        subject: 'Level 1: AD Hoc Hunting'
        entries:
          - label: Characteristics
            value:
              - Hunt when specific intelligence received
              - No regular hunting cadence
              - No formal hunting process
          - label: Frequency
            value: Occasional
      - type: fields
        subject: 'Level 2: Structured Hunting'
        entries:
          - label: Characteristics
            value:
              - Weekly/monthly hunting sprints
              - Documented hunting playbooks
              - Intelligence-driven hypotheses
              - Hunt findings tracked and analyzed
          - label: Frequency
            value: Regular (weekly or monthly)
      - type: fields
        subject: 'Level 3: Continuous Hunting'
        entries:
          - label: Characteristics
            value:
              - Dedicated threat hunting team
              - Daily hunting operations
              - Automated hunting queries
              - Hunt metrics and effectiveness tracking
          - label: Frequency
            value: Continuous
      - type: fields
        subject: 'Level 4: AI Assisted Hunting'
        entries:
          - label: Characteristics
            value:
              - Machine learning identifies anomalies for hunting
              - Automated hypothesis generation from intelligence
              - Continuous behavioral analysis
              - Hunter focuses on complex investigations
          - label: Frequency
            value: Real-time
  - heading: Automated Intelligence Operationalization
    id: automated_intelligence_operationalization
    blocks:
      - type: definition
        items:
          - term: Concept
            description: Minimize time from intelligence receipt to operational use
      - type: heading
        level: 3
        text: Automation Workflows
      - type: heading
        level: 4
        text: IOC Auto Blocking
      - type: fields
        subject: Workflow
        entries:
          - label: Step 1
            value: TIP receives IOC from high-confidence source
          - label: Step 2
            value: TIP validates IOC (confidence ≥ high, not whitelisted)
          - label: Step 3
            value: TIP tags IOC as 'auto-block'
          - label: Step 4
            value: TIP API pushes IOC to firewall, proxy, EDR
          - label: Step 5
            value: Security tools block IOC automatically
          - label: Step 6
            value: TIP creates ticket for review (post-action validation)
      - type: heading
        level: 5
        text: Guardrails
      - type: list
        style: bullet
        items:
          - Only high-confidence IOCs auto-blocked
          - Whitelisted infrastructure never blocked
          - 'Circuit breaker: Pause if >100 blocks in 1 hour (potential false positives)'
          - Human review within 24 hours
      - type: heading
        level: 5
        text: Metrics
      - type: list
        style: bullet
        items:
          - IOCs auto-blocked per day
          - 'Time from IOC receipt to blocking: Target <5 minutes'
          - 'False positive rate: Target <1%'
      - type: heading
        level: 4
        text: Detection Rule Auto Deployment
      - type: fields
        subject: Workflow
        entries:
          - label: Step 1
            value: Intelligence team creates Sigma detection rule
          - label: Step 2
            value: Rule committed to Git repository
          - label: Step 3
            value: CI/CD pipeline runs automated tests
          - label: Step 4
            value: Rule converted to SIEM-specific format (Splunk SPL, Elastic KQL)
          - label: Step 5
            value: Automated deployment to test SIEM
          - label: Step 6
            value: Validation against historical data (false positive check)
          - label: Step 7
            value: If validation passes, deploy to production SIEM
          - label: Step 8
            value: Monitor rule performance for 7 days
      - type: heading
        level: 5
        text: Guardrails
      - type: list
        style: bullet
        items:
          - All rules tested before production
          - False positive rate <5% in testing
          - Human approval required for high-impact rules (account lockouts, etc)
          - Automated rollback if production FP rate >10%
      - type: definition
        items:
          - term: Cross-reference
            description: See Chapter 4.1 Security Automation for detection-as-code details
      - type: heading
        level: 4
        text: Automated Threat Hunting
      - type: heading
        level: 5
        text: Scheduled Hunting Queries
      - type: heading
        level: 6
        text: Approach
      - type: list
        style: bullet
        items:
          - Intelligence team defines hunting queries for known TTPs
          - Queries scheduled to run daily/weekly
          - Results automatically analyzed for anomalies
          - High-confidence findings create tickets for investigation
      - type: fields
        subject: Example
        entries:
          - label: Query name
            value: Hunt for Kerberoasting
          - label: Schedule
            value: Daily
          - label: Query
            value: index=windows EventCode=4769 Ticket_Encryption_Type=0x17 Service_Name!=*$ | stats count
              by Account_Name, Service_Name, Client_Address | where count > 10
          - label: Threshold
            value: Alert if >10 requests for non-machine accounts in 24 hours
      - type: heading
        level: 5
        text: Continuous Behavioral Analysis
      - type: heading
        level: 6
        text: Approach
      - type: list
        style: bullet
        items:
          - Machine learning models trained on normal behavior
          - Continuously analyze logs for anomalies
          - Intelligence informs which behaviors to model
      - type: fields
        subject: Example
        entries:
          - label: Intelligence
            value: Adversaries use WMI for lateral movement
          - label: Model
            value: Baseline normal WMI usage per user/system
          - label: Detection
            value: Alert on WMI usage anomalies (unusual user, unusual target, unusual frequency)
