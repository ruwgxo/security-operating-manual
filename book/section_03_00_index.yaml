chapter_overview:
  overview: >-
    Security automation transforms repetitive manual tasks into scalable, consistent, and rapid machine-executed
    processes. The average security analyst spends 60-70% of time on repetitive tasks: alert triage, log
    analysis, ticket creation, data enrichment. Automation reclaims this time for high-value work: threat
    hunting, detection engineering, architecture.


    This chapter addresses security automation at enterprise scale: SOAR platforms, response playbooks,
    detection-as-code, infrastructure security automation. Organizations automating effectively achieve
    10x improvement in mean time to respond while reducing analyst burnout and operational costs.


    Security automation is not replacing analysts - it's amplifying their capability. One analyst with
    automation handles workload of five analysts without automation. This chapter shows how to build that
    multiplier.
