chapter_overview:
  overview: >-
    Identity and Access Management (IAM) is the foundation of modern security architecture. In traditional
    perimeter-based security, the network boundary defined trust. In cloud-native and remote-work environments,
    identity has become the perimeter. Every access decision—to applications, data, infrastructure— depends
    on robust identity verification and authorization.


    This chapter addresses IAM at enterprise scale: managing thousands of users, hundreds of thousands
    of service accounts, complex authorization policies, and zero-trust identity architectures. IAM done
    right prevents the credential compromise and privilege escalation that detection engineering (Chapter
    2.4) is designed to catch.


    Use the maturity model to assess current IAM capability and follow the appropriate implementation
    path. This chapter serves organizations from basic Active Directory deployments to sophisticated zero-trust
    identity architectures with continuous authentication and risk-based access control.
