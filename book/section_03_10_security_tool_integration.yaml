      - type: prose
        text: >-
          Level 2+ organizations integrating security tools with automation
  - heading: Overview
    id: overview
    blocks:
      - type: prose
        text: >-
          Security tool integration enables orchestration across security stack. This section addresses
          integration patterns, API best practices, and common integration challenges.
  - heading: Integration Approaches
    id: integration_approaches
    blocks:
      - type: fields
        subject: API Integration
        entries:
          - label: Method
            value: Direct API calls from automation platform
          - label: Advantages
            value:
              - Real-time interaction
              - Rich functionality
              - Bidirectional communication
          - label: Challenges
            value:
              - API authentication and credential management
              - Rate limiting
              - API version changes
          - label: Best practices
            value:
              - Use API keys or OAuth tokens
              - Implement exponential backoff for rate limits
              - Version API calls, test before upgrading
      - type: fields
        subject: Webhook Integration
        entries:
          - label: Method
            value: Tool sends webhook to automation platform on events
          - label: Advantages
            value:
              - Real-time event notification
              - No polling required
              - Efficient
          - label: Challenges
            value:
              - Webhook authentication
              - Reliability (what if webhook fails?)
              - Event deduplication
          - label: Best practices
            value:
              - Validate webhook signature
              - Implement idempotent webhook handlers
              - Log all webhooks for replay if needed
      - type: fields
        subject: Syslog Integration
        entries:
          - label: Method
            value: Tool sends logs via syslog, automation parses
          - label: Advantages
            value:
              - Universal protocol
              - Works with legacy tools
          - label: Challenges
            value:
              - Unstructured log parsing
              - Limited interaction (one-way)
          - label: Best practices
            value:
              - Normalize syslog to structured format
              - Use syslog for alerting, API for actions
