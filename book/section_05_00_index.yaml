chapter_overview:
  overview: >-
    Threat intelligence transforms raw data into actionable insights that enable proactive defense. Without
    intelligence, security teams fight blind - reacting to attacks without understanding adversary objectives,
    tactics, or future moves. With intelligence, teams anticipate threats, prioritize defenses, and detect
    attacks before significant impact.


    Threat intelligence operates at three levels: Strategic intelligence informs executive decisions about
    security investments and risk. Operational intelligence guides security architecture and detection
    engineering. Tactical intelligence enables immediate threat hunting and blocking of known-malicious
    infrastructure.


    This chapter addresses threat intelligence operations at enterprise scale: building intelligence programs
    from scratch, integrating intelligence into detection and response workflows, measuring intelligence
    effectiveness, and contributing to community intelligence sharing. Organizations with mature intelligence
    programs detect threats 60-80% faster and prevent attacks that others only discover after breach.


    Threat intelligence is not collecting IOCs - it's understanding adversaries well enough to predict
    their next moves and defend proactively.
