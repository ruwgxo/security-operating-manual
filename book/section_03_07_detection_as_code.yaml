  - heading: Overview
    id: overview
    blocks:
      - type: prose
        text: >-
          Detection-as-code applies software engineering practices to security detection development.
          Detections are code, version controlled, tested, and deployed via CI/CD. This section expands
          on Chapter 2.4's detection engineering with automation-focused implementation patterns.
