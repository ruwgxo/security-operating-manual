prose_content:
  - heading: Audience
    id: audience
    blocks:
      - type: prose
        text: >-
          Level 2+ organizations managing service-to-service authentication
  - heading: Overview
    id: overview
    blocks:
      - type: prose
        text: >-
          Service accounts authenticate applications and services, not humans. They proliferate rapidly,
          often have excessive permissions, and use long-lived credentials. Service account compromise
          enables persistent access without triggering user-based detections. This section addresses discovery,
          lifecycle, and security of non-human identities.
  - heading: Service Account Challenges
    id: service_account_challenges
    blocks:
      - type: fields
        subject: Proliferation
        entries:
          - label: Problem
            value: Service accounts created ad-hoc without tracking
          - label: Scale
            value: 10-100x more service accounts than users in large organizations
          - label: Symptoms
            value:
              - No central inventory
              - Unknown owners
              - Cannot determine purpose
      - type: fields
        subject: Excessive Permissions
        entries:
          - label: Problem
            value: Service accounts granted admin rights for convenience
          - label: Rationale
            value: Developer doesn't know minimum permissions, grants owner/admin
          - label: Risk
            value: Compromise of service account = full environment access
      - type: fields
        subject: Long Lived Credentials
        entries:
          - label: Problem
            value: API keys and passwords never rotated
          - label: Reality
            value: Service account keys 5+ years old common
          - label: Risk
            value: Years of opportunity for credential theft
      - type: fields
        subject: No MFA
        entries:
          - label: Problem
            value: Service accounts authenticate with password/key only
          - label: Rationale
            value: No human to perform MFA interaction
          - label: Risk
            value: Stolen credential = immediate access
  - heading: Service Account Lifecycle
    id: service_account_lifecycle
    blocks:
      - type: heading
        level: 3
        text: Discovery and Inventory
      - type: fields
        subject: Discovery Methods
        entries:
          - label: Directory query
            value:
              - Query directory for accounts with 'svc-' prefix or non-interactive flag
              - Identify accounts with no password expiration
              - Find accounts that never login interactively
          - label: Authentication log analysis
            value:
              - Analyze SIEM for service authentication patterns
              - Identify accounts with API/programmatic authentication only
              - Find accounts authenticating 24/7 or in regular intervals
          - label: Application survey
            value:
              - Survey application teams for service accounts
              - Review CI/CD systems for stored credentials
              - Audit cloud platforms for service accounts and keys
      - type: heading
        level: 4
        text: Inventory Attributes
      - type: list
        style: bullet
        items:
          - Account name and unique ID
          - Owner (team responsible)
          - Purpose (what application or service)
          - Permissions granted
          - Credential type (password, key, certificate)
          - Credential age and last rotation
          - Last authentication time
          - Expiration date (force review)
      - type: heading
        level: 3
        text: Service Account Creation Process
      - type: fields
        subject: Request and Approval
        entries:
          - label: Step 1
            value: Developer submits service account request via portal
          - label: Step 2
            value: Specify purpose, required permissions, expiration
          - label: Step 3
            value: Security reviews and approves (or requests clarification)
          - label: Step 4
            value: Automated provisioning with approved parameters
      - type: fields
        subject: Least Privilege Enforcement
        entries:
          - label: Principle
            value: Grant minimum permissions required for service function
          - label: Implementation
            value:
              - Start with read-only access
              - Add write permissions only if required
              - Never grant admin unless absolutely necessary
              - Document justification for each permission
      - type: fields
        subject: Naming Convention
        entries:
          - label: Purpose
            value: Identify service accounts and their purpose from name
          - label: Examples
            value:
              - svc-app-database-reader (service, app name, function)
              - sa-cicd-deploy (service account, system, function)
      - type: heading
        level: 3
        text: Credential Rotation
      - type: fields
        subject: Automated Rotation
        entries:
          - label: Implementation
            value:
              - PAM solution rotates credentials on schedule
              - Application retrieves new credential from vault
              - Old credential invalidated
          - label: Frequency
            value: 30-90 days recommended
      - type: heading
        level: 4
        text: Rotation Challenges
      - type: fields
        subject: Legacy Applications
        entries:
          - label: Problem
            value: Hardcoded credentials in config files
          - label: Mitigation
            value:
              - Migrate to secret management (Vault, AWS Secrets Manager)
              - Use configuration management to deploy rotated credentials
      - type: fields
        subject: Distributed Systems
        entries:
          - label: Problem
            value: Multiple services sharing credential, rotation breaks one
          - label: Mitigation
            value:
              - Each service gets unique credential
              - Coordinate rotation windows
      - type: heading
        level: 3
        text: Ephemeral Credentials
      - type: heading
        level: 4
        text: Workload Identity
      - type: definition
        items:
          - term: Concept
            description: Service authenticates using platform-provided identity, no keys
      - type: heading
        level: 5
        text: AWS IAM Roles
      - type: list
        style: bullet
        items:
          - EC2 instance assumes IAM role
          - Application uses IMDSv2 to retrieve temporary credentials
          - Credentials rotate automatically every hour
          - No long-lived access keys required
      - type: heading
        level: 5
        text: GCP Service Accounts
      - type: list
        style: bullet
        items:
          - Compute instance uses service account attached to instance
          - Application uses metadata service to get tokens
          - Tokens short-lived and automatically refreshed
      - type: heading
        level: 5
        text: Azure Managed Identity
      - type: list
        style: bullet
        items:
          - VM or App Service assigned managed identity
          - Application authenticates using Azure Instance Metadata Service
          - No credentials to manage
      - type: heading
        level: 5
        text: Kubernetes Service Accounts
      - type: prose
        text: >-
          Pod uses Kubernetes service account
      - type: prose
        text: >-
          Token automatically mounted in pod
      - type: fields
        subject: Kubernetes service accounts 3
        entries:
          - label: Kubernetes service accounts
            value:
              - Token bound to pod lifetime
      - type: heading
        level: 4
        text: OAuth Client Credentials
      - type: list
        style: bullet
        items:
          - Service authenticates to authorization server
          - Receives short-lived access token
          - Uses token to access APIs
          - Token expires (1-24 hours), service requests new token
      - type: heading
        level: 3
        text: Service Account Monitoring
      - type: fields
        subject: Detection Use Cases
        entries:
          - label: Anomalous authentication
            value:
              - Service account login from unexpected location
              - Authentication from IP not associated with known infrastructure
          - label: Privilege escalation
            value:
              - Service account permissions elevated
              - Service account added to admin groups
          - label: Lateral movement
            value:
              - Service account accessing systems outside normal scope
              - Unusual API calls or resource access
          - label: Credential theft indicators
            value:
              - Multiple simultaneous authentications from different IPs
              - Authentication patterns inconsistent with service behavior
