      - type: heading
        level: 3
        text: 'Month 12: Detection as Code'
      - type: definition
        items:
          - term: Goal
            description: Implement detection engineering as code with CI/CD
      - type: heading
        level: 4
        text: Detection Rules as Code
      - type: definition
        items:
          - term: Format
            description: Sigma rules (vendor-agnostic YAML)
      - type: code
        lang: text
        caption: >-
          Repository structure
        text: |
          detection-rules/
            rules/
              authentication/
                brute_force.yml
                impossible_travel.yml
              malware/
                mimikatz.yml
                cobalt_strike.yml
              network/
                c2_beaconing.yml
                dns_tunneling.yml
            tests/
              test_brute_force.py
              test_impossible_travel.py
            .github/
              workflows/
                test_and_deploy.yml
      - type: heading
        level: 4
        text: CI/CD Pipeline
      - type: fields
        subject: On Commit
        entries:
          - label: 'Step 1: Validation'
            value:
              - Validate Sigma rule syntax
              - Check required fields present
              - Lint YAML format
          - label: 'Step 2: Testing'
            value:
              - Run unit tests against known good/bad samples
              - Verify true positive detection
              - Verify false positive handling
          - label: 'Step 3: Conversion'
            value:
              - Convert Sigma to SIEM-specific format (Splunk SPL, Elastic KQL)
              - Validate converted queries
          - label: 'Step 4: Deployment to test'
            value:
              - Deploy to test SIEM environment
              - Run against historical data
              - Measure false positive rate
      - type: fields
        subject: On Merge to Main
        entries:
          - label: 'Step 5: Production deployment'
            value:
              - Deploy to production SIEM
              - Enable alerting
              - Update documentation
              - Notify SOC team of new detection
      - type: heading
        level: 4
        text: Testing Framework
      - type: heading
        level: 5
        text: Test Data Management
      - type: list
        style: bullet
        items:
          - Maintain library of known malicious samples
          - Maintain library of benign samples
          - Update test data when detections fail
      - type: heading
        level: 5
        text: Automated Testing
      - type: list
        style: bullet
        items:
          - Every detection rule has test cases
          - Tests run on every commit
          - Tests verify detection logic and thresholds
      - type: code
        lang: python
        caption: >-
          Example test
        text: |
          def test_brute_force_detection():
              # Known bad: 10 failed logins in 5 minutes
              events = generate_failed_logins(count=10, timespan=300)
              result = run_detection(brute_force_rule, events)
              assert result.alert_triggered == True

              # Known good: 3 failed logins in 5 minutes
              events = generate_failed_logins(count=3, timespan=300)
              result = run_detection(brute_force_rule, events)
              assert result.alert_triggered == False
      - type: heading
        level: 4
        text: Version Control Benefits
      - type: list
        style: bullet
        items:
          - Track all changes to detection rules
          - Roll back problematic rules instantly
          - Peer review all rule changes
          - Audit trail of rule evolution
