chapter_overview:
  overview: >-
    Detection engineering is the systematic practice of designing, developing, and operating security
    detection capabilities at scale. This framework addresses detection strategy, implementation patterns,
    and operational excellence for enterprise environments processing millions of security events daily.


    This chapter serves organizations at all maturity levels, from greenfield deployments with zero detection
    capability to advanced programs deploying custom machine learning models and automated response. Use
    the maturity model to identify your current state and follow the appropriate path.
